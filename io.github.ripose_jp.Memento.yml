app-id: io.github.ripose_jp.Memento
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: memento
rename-desktop-file: memento.desktop
rename-icon: memento

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --share=network
  - --socket=pulseaudio
  - --filesystem=/tmp:rw
  - --filesystem=xdg-pictures:rw
  - --filesystem=xdg-videos:rw
  - --filesystem=host:ro
  - --env=LC_NUMERIC=C
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-run/pipewire-0:ro

  - --talk-name=org.freedesktop.ScreenSaver

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /man
  - /share/aclocal
  - /share/doc
  - /share/info
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'

modules:
  - modules/mpv.yaml
  - modules/python-modules.yaml
  - modules/yt-dlp.yaml

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.12.1.tar.gz
        sha256: 3b66fe92cbc768d8d4d16e1427bfb7399e15d9c2795c2fc482e7b30a6332a422
        x-checker-data:
          type: anitya
          project-id: 10649
          stable-only: true
          url-template: https://libzip.org/download/libzip-$version.tar.gz

  - name: json-c
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/json-c/json-c.git
        tag: json-c-0.19-20260627
        commit: aa716cd8d663c976b99b0f30f102ee1d8ef63146
        x-checker-data:
          type: git
          url: https://api.github.com/repos/json-c/json-c/tags
          tag-pattern: ^json-c-([\d.]+)-\d+$

  - name: mecab
    buildsystem: autotools
    config-opts:
      - --with-charset=utf-8
    cleanup:
      - /bin
      - /libexec/mecab/mecab-*
    sources:
      - type: archive
        archive-type: tar
        url: https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/mecab/mecab-0.996.tar.gz
        sha256: e073325783135b72e666145c781bb48fada583d5224fb2490fb6c1403ba69c59
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: mecab-ipadic
    buildsystem: autotools
    config-opts:
      - --with-charset=utf-8
    cleanup:
      - /bin
      - /libexec/mecab/mecab-*
    sources:
      - type: archive
        archive-type: tar
        url: https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/mecab/mecab-ipadic-2.7.0-20070801.tar.gz
        sha256: b62f527d881c504576baed9c6ef6561554658b175ce6ae0096a60307e49e3523
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: memento
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_BUILD_TYPE=Release
      - -DMEMENTO_RELEASE_BUILD=ON
      - -DMEMENTO_QAPPLICATION=ON
      - -DMEMENTO_SYSTEM_QCORO=ON
      - -DMEMENTO_MECAB_SUPPORT=ON
    post-install:
      - install -Dm644 $FLATPAK_BUILDER_BUILDDIR/$FLATPAK_ID.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/ripose-jp/Memento.git
        tag: v2.1.0
        commit: 7af228050dfc72e19052b77580faf383af489009
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: file
        path: io.github.ripose_jp.Memento.metainfo.xml
